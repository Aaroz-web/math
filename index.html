<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vesistö GeoGuessr</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07131d;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#17435a 0,#07131d 45%,#040a10 100%);z-index:-2}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(10,45,65,.35),rgba(0,0,0,.55))}
.wrap{width:min(980px,94%);margin:auto;padding:28px 0 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:900;letter-spacing:.5px;font-size:22px}.pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);padding:8px 13px;border-radius:999px}
.card{background:rgba(10,22,31,.82);border:1px solid rgba(255,255,255,.12);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.hero{height:470px;position:relative;background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,0,0,.72))}
.q{position:absolute;left:24px;right:24px;bottom:22px;z-index:2}.q small{opacity:.8}.q h1{font-size:clamp(25px,5vw,42px);margin:5px 0 0}
.content{padding:22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit}.answer{padding:17px;border-radius:15px;border:1px solid rgba(255,255,255,.14);background:#102431;color:white;text-align:left;cursor:pointer;font-weight:750;transition:.15s}
.answer:hover{transform:translateY(-2px);background:#163548}.answer:disabled{cursor:default}.correct{background:#135c45!important;border-color:#38d39f!important}.wrong{background:#663238!important;border-color:#ff7d89!important}
#feedback{min-height:28px;margin:16px 0 5px;font-weight:800}.next{width:100%;padding:15px;border:0;border-radius:14px;background:#fff;color:#07131d;font-weight:900;cursor:pointer;display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{flex:1;min-width:120px;background:rgba(255,255,255,.07);padding:12px;border-radius:14px}.stat b{display:block;font-size:22px}
.start,.end{text-align:center;padding:48px 25px}.start h1,.end h1{font-size:42px;margin:8px 0}.start p{opacity:.8;max-width:620px;margin:0 auto 25px;line-height:1.6}
.primary{border:0;border-radius:14px;padding:15px 24px;background:#fff;color:#07131d;font-weight:900;cursor:pointer;font-size:16px}
@media(max-width:650px){.hero{height:380px}.answers{grid-template-columns:1fr}.wrap{padding-top:15px}.start h1,.end h1{font-size:32px}}
</style>
</head>
<body><div class="bg"></div><main class="wrap">
<header><div class="logo">🌊 Vesistö GeoGuessr</div><div class="pill">Pisteet: <b id="score">0</b></div></header>
<section class="card" id="game"></section>
</main>
<script>
const questions=[
{type:"Meri",image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=85",opts:["Meri","Järvi","Joki","Lampi"]},
{type:"Järvi",image:"https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=1600&q=85",opts:["Meri","Järvi","Joki","Koski"]},
{type:"Joki",image:"https://images.unsplash.com/photo-1473445361085-b9a07f55608b?auto=format&fit=crop&w=1600&q=85",opts:["Järvi","Joki","Lampi","Laguuni"]},
{type:"Vesiputous",image:"https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=1600&q=85",opts:["Vuono","Suisto","Vesiputous","Kanava"]},
{type:"Vuono",image:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85",opts:["Vuono","Lampi","Säiliö","Suisto"]},
{type:"Laguuni",image:"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1600&q=85",opts:["Laguuni","Joki","Järvi","Koski"]},
{type:"Suisto",image:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85",opts:["Lampi","Suisto","Meri","Kanava"]},
{type:"Kanava",image:"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=85",opts:["Kanava","Vuono","Joki","Järvi"]},
{type:"Koski",image:"https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1600&q=85",opts:["Koski","Meri","Laguuni","Suisto"]},
{type:"Lampi",image:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=85",opts:["Lampi","Meri","Vuono","Kanava"]}
];
let round=0,score=0,streak=0,best=0,answered=false;
const game=document.getElementById("game"), scoreEl=document.getElementById("score");
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){round=0;score=0;streak=0;answered=false;render()}
function render(){
 if(round>=questions.length){end();return}
 const x=questions[round]; const opts=shuffle(x.opts);
 game.innerHTML='<div class="hero" style="background-image:url(\''+x.image+'\')"><div class="q"><small>Kierros '+(round+1)+' / '+questions.length+'</small><h1>Mikä vesistö tässä on?</h1></div></div><div class="content"><div class="answers">'+opts.map(o=>'<button class="answer" data-answer="'+o+'">'+o+'</button>').join("")+'</div><div id="feedback"></div><button class="next" id="next">Seuraava →</button><div class="stats"><div class="stat">Pisteet<b id="s2">'+score+'</b></div><div class="stat">Putki<b id="streak">'+streak+'</b></div><div class="stat">Paras putki<b>'+best+'</b></div></div></div>';
 game.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(b,x.type));
 scoreEl.textContent=score;
}
function answer(btn,correct){
 if(answered)return;answered=true;
 const all=game.querySelectorAll(".answer");all.forEach(b=>b.disabled=true);
 if(btn.dataset.answer===correct){streak++;best=Math.max(best,streak);score+=100+Math.max(0,streak-1)*25;btn.classList.add("correct");document.getElementById("feedback").textContent="✓ Oikein! +"+(100+(streak-1)*25)+" pistettä";}
 else{streak=0;btn.classList.add("wrong");all.forEach(b=>{if(b.dataset.answer===correct)b.classList.add("correct")});document.getElementById("feedback").textContent="✕ Väärin — oikea vastaus: "+correct;}
 document.getElementById("s2").textContent=score;document.getElementById("streak").textContent=streak;scoreEl.textContent=score;document.getElementById("next").style.display="block";
}
function end(){game.innerHTML='<div class="end"><div style="font-size:54px">🌊</div><h1>Peli ohi!</h1><p>Sait <b>'+score+'</b> pistettä ja paras putkesi oli <b>'+best+'</b>.</p><button class="primary" onclick="start()">Pelaa uudestaan</button></div>';scoreEl.textContent=score}
game.innerHTML='<div class="start"><div style="font-size:64px">🌊</div><h1>Vesistö GeoGuessr</h1><p>Tunnista kuvasta, mikä vesistö on kyseessä. Valitse vastaus mahdollisimman nopeasti ja rakenna pitkä oikeiden vastausten putki.</p><button class="primary" onclick="start()">Aloita peli</button></div>';
document.addEventListener("click",e=>{if(e.target.id==="next"){round++;answered=false;render()}});
</script></body></html>
